name: Build, test and deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build distributable website
        run: python scripts/build_release.py
      - name: Verify download packages
        run: python tests/test_release.py
      - name: Validate browser JavaScript and telemetry isolation
        run: python tests/test_scripts.py
      - name: Test Dataverse context resolution (root, virtual folders, versioned URLs)
        run: node tests/context-loader.test.cjs
      - name: Validate configuration migration safety checks
        run: python tests/test_migration.py
      - name: Run Configuration Migration Studio behaviour tests
        run: node tests/migration.test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
